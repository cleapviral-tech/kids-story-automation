name: music-video

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/music-video.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydub Pillow moviepy || true
          mkdir -p output

      - name: Generate Music Video
        run: |
          echo "Checking files..."
          ls -la
          echo "Creating sample video..."
          ffmpeg -y -f lavfi -i color=c=black:s=1280x720:d=5 -f lavfi -i anullsrc=r=44100:cl=stereo -shortest output/sample-video.mp4
          echo "Video created successfully"
          ls -lh output/

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: music-video-output
          path: output/
          retention-days: 5
